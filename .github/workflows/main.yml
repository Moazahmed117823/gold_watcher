name: Egypt Gold Watcher

on:
  schedule:
    # Every 30 minutes, in UTC.
    # Cairo is UTC+2 (winter) / UTC+3 (summer) - a fixed 30-min interval
    # is identical in both timezones, so no conversion needed.
    - cron: '*/30 * * * *'
  workflow_dispatch:      # allows manual "Run workflow" button in the Actions tab

permissions:
  contents: write        # needed so the workflow can commit the updated CSV

concurrency:
  group: gold-watcher    # never run two checks at the same time
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch gold prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Commit price history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold_prices.csv
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "gold prices: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
