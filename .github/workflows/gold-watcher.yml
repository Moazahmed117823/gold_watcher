name: Egypt Gold Watcher

on:
  schedule:
    # Every 30 minutes, in UTC.
    # Cairo is UTC+2 (winter) / UTC+3 (summer) - a fixed 30-min interval
    # is identical in both timezones, so no conversion needed.
    - cron: '*/5 * * * *'
  workflow_dispatch:      # allows manual "Run workflow" button in the Actions tab

permissions:
  contents: write        # needed so the workflow can commit the updated CSV

concurrency:
  group: gold-watcher    # never run two checks at the same time
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # ============================================================
      # 21K TARGET PRICE (EGP) - edit this one number whenever you like.
      # You get a Telegram alert when the 21K gram price CROSSES this
      # level (rises above it or falls below it). Set to 0 to disable.
      # ============================================================
      TARGET_21K: '6300'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch gold prices
        env:
          # Telegram (primary channel - see README Step 4 for 2-minute setup)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional WhatsApp via Green API free tier (see README Step 4b):
          # GREENAPI_INSTANCE_ID: ${{ secrets.GREENAPI_INSTANCE_ID }}
          # GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          # WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          # CallMeBot is currently full for new signups; kept for later:
          # CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python scraper.py

      - name: Commit price history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold_prices.csv
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "gold prices: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
