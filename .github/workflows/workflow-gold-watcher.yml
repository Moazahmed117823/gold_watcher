name: Egypt Gold Watcher

on:
  workflow_dispatch:      # allows manual "Run workflow" button in the Actions tab
    inputs:
      force:
        description: 'Send the Telegram report even if nothing changed (test)'
        type: boolean
        default: false

permissions:
  contents: write        # needed so the workflow can commit the updated CSV

concurrency:
  group: gold-watcher    # never run two checks at the same time
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # ============================================================
      # 21K TARGET PRICE (EGP) - edit this one number whenever you like.
      # ============================================================
      TARGET_21K: '6500'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch gold prices
        env:
          # Telegram (primary channel)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      # ============================================================
      # NEW: prediction gauge (technical + TradingView + AI news reader)
      # Degrades gracefully: if LLM_API_KEY is unset it still computes
      # the gauge from technical + consensus only.
      # ============================================================
      - name: Run prediction gauge
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_BASE_URL: https://api.groq.com/openai/v1
          LLM_MODEL: openai/gpt-oss-20b
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python predictor.py ${{ inputs.force == true && '--force' || '' }}

      - name: Commit price history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "gold prices: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
